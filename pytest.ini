[pytest]
testpaths = tests
# Some machines (this one included) have ROS/ament on PYTHONPATH. Their pytest
# plugins are auto-loaded and fail to import, which takes the whole run down
# before a single test executes. Disabling them here keeps `pytest` working
# regardless of what else is installed system-wide; harmless if they are absent.
addopts = -q
  -p no:launch_testing
  -p no:launch_ros
  -p no:ament_copyright
  -p no:ament_pep257
  -p no:ament_xmllint
  -p no:ament_lint
  -p no:ament_flake8
